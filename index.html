<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community Rangliste von NocNocItsMe</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="background"></div>



<header>

<div class="ghost">👻</div>

<h1>
Community Rangliste von NocNocItsMe
</h1>

<p class="subtitle">
HC SSF Runes of Aldur Community
</p>

</header>




<section class="register-panel">

<h2>
👻 Charakter anmelden
</h2>


<p>
Nur Charaktere mit <b>HCSSFNoc_</b> können teilnehmen.
</p>


<div class="register-box">

<input
id="characterName"
type="text"
placeholder="HCSSFNoc_DeinCharakter"
>


<button onclick="registerCharacter()">
Zur Community hinzufügen
</button>


</div>


<p id="message"></p>


</section>






<section class="status-panel">


<div>

<span class="label">
Community Mitglieder
</span>

<span id="memberCount">
-
</span>

</div>



<div>

<span class="label">
Letzte Aktualisierung
</span>

<span id="updated">
-
</span>

</div>


</section>







<section class="content">


<input
id="search"
type="text"
placeholder="Charakter suchen..."
>




<table>


<thead>

<tr>

<th>
Community Rang
</th>


<th>
Charakter
</th>


<th>
Level
</th>


<th>
Klasse
</th>

<th>
Status
</th>

<th>
Offizieller Rang
</th>


</tr>


</thead>



<tbody id="ladderBody">


</tbody>



</table>


</section>




<footer>

NocNocItsMe Community Ladder 👻

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


</body>

</html>
