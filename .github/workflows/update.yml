name: Update NocNoc Ladder


on:

  schedule:

    # alle 15 Minuten

    - cron: "*/15 * * * *"


  workflow_dispatch:





jobs:


  update:


    runs-on: ubuntu-latest



    steps:


      - name: Repository laden
        uses: actions/checkout@v4




      - name: Python installieren
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      - name: Abhängigkeiten installieren

        run: |

          pip install -r requirements.txt





      - name: Ladder aktualisieren

        env:

          SUPABASE_URL:
            ${{ secrets.SUPABASE_URL }}

          SUPABASE_KEY:
            ${{ secrets.SUPABASE_KEY }}


        run: |

          python scripts/update_ladder.py
